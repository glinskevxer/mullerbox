[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "mullerbox"
version = "0.1.0"
description = "Green sand control for a grey iron foundry: sand properties, additions and defect attribution"
requires-python = ">=3.12"
dependencies = ["click==8.1.8"]

[project.scripts]
mullerbox = "mullerbox.cli:main"

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
  "pytest-cov==6.0.0",
  "coverage==7.6.12",
  "ruff==0.9.7",
  "mypy==1.15.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mullerbox"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "RET", "ARG", "N", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tests"]

[tool.coverage.run]
branch = true
source = ["src/mullerbox"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
